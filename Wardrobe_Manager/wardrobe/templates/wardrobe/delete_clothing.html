<!DOCTYPE html>
<html>
<head>
    <title>Delete Clothing</title>
</head>
<body>

    <h2>Delete Clothing</h2>

    <p>Are you sure you want to delete "{{ clothing.name }}"?</p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">Yes, Delete</button>
    </form>

    <a href="{% url 'closet' %}">Cancel</a>

</body>
</html>
