<form method="POST" id="outfit-form">
    {% csrf_token %}

    {{ form.as_p }}

    <button
        type="submit"
        id="generate-btn"
        {% if cooldown %}disabled{% endif %}
    >
        {% if cooldown %}
            Please wait... ⏳
        {% else %}
            Generate Outfit ✨
        {% endif %}
    </button>

    <p id="wait-message">
        {% if cooldown %}
            Please wait 30 seconds before generating another outfit.
        {% endif %}
    </p>
</form>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

{% if recommendation %}
    <hr>

    <h2>Your AI Recommendation</h2>

    <p>
        {{ recommendation|linebreaksbr }}
    </p>
{% endif %}

{% if cooldown %}
<script>
    let seconds = 30;

    const button = document.getElementById("generate-btn");
    const message = document.getElementById("wait-message");

    const countdown = setInterval(function () {

        seconds--;

        if (seconds > 0) {
            button.textContent = `Please wait ${seconds}s... ⏳`;
            message.textContent =
                `You can generate another outfit in ${seconds} seconds.`;
        } else {

            clearInterval(countdown);

            button.disabled = false;
            button.textContent = "Generate Outfit ✨";
            message.textContent = "";
        }

    }, 1000);
</script>
{% endif %}
