{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add to Your Wardrobe</title>
    <link rel="stylesheet" href="{% static 'css/add_clothing.css' %}">
</head>
<body class="add-clothing-page">
    <header class="app-header">
        <a class="app-brand" href="{% url 'home' %}">Wardrobe / Studio</a>
        <nav class="app-nav" aria-label="Primary navigation">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'closet' %}">Closet</a>
            <a href="{% url 'outfit' %}">Outfits</a>
            <a class="active" href="{% url 'add_clothing' %}">Add Clothing</a>
            <a href="{% url 'add_outfit' %}">Create Outfit</a>
            <a href="{% url 'ai_generator' %}">AI Stylist</a>
            <a href="{% url 'logout' %}">Log out</a>
        </nav>
    </header>
    <main class="add-clothing-shell">
        <header class="add-clothing-header">
            <p class="add-clothing-kicker">Your personal collection</p>
            <h1>Add to Your Wardrobe</h1>
            <p class="add-clothing-subtitle">Add a new piece to your collection.</p>
        </header>

        <section class="add-clothing-card" aria-labelledby="add-clothing-form-title">
            <h2 id="add-clothing-form-title">Piece details</h2>

            <form class="add-clothing-form" method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                {{ form.as_p }}

                <button class="add-clothing-submit" type="submit">Add to Wardrobe</button>
            </form>
        </section>

        <a class="add-clothing-back-link" href="{% url 'closet' %}">Back to Closet</a>
    </main>

</body>
</html>
